name: SMLIGHT SLZB-MR4U OpenThread RCP
device: EFR32MG26B420F3200IM48
base_project: src/openthread_rcp
filename: "{manifest_name}_{sdk_version}_{fw_version}_{baudrate}_{fw_variant}"
sdk: "simplicity_sdk:2026.6.1"
toolchain: "gcc:14.2.1"

gbl:
  fw_type: openthread_rcp
  baudrate: 460800
  fw_variant: hw_flow

c_defines:
  SL_IOSTREAM_EUSART_VCOM_BAUDRATE: 460800
  SL_IOSTREAM_EUSART_VCOM_FLOW_CONTROL_TYPE: SL_IOSTREAM_EUSART_UART_FLOW_CTRL_CTS_RTS

  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL: EUSART0
  SL_IOSTREAM_EUSART_VCOM_PERIPHERAL_NO: 0

  SL_IOSTREAM_EUSART_VCOM_TX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_TX_PIN: 5

  SL_IOSTREAM_EUSART_VCOM_RX_PORT: SL_GPIO_PORT_A
  SL_IOSTREAM_EUSART_VCOM_RX_PIN: 6

  SL_IOSTREAM_EUSART_VCOM_CTS_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_EUSART_VCOM_CTS_PIN: 1

  SL_IOSTREAM_EUSART_VCOM_RTS_PORT: SL_GPIO_PORT_B
  SL_IOSTREAM_EUSART_VCOM_RTS_PIN: 0

  SL_CLOCK_MANAGER_HFXO_CTUNE: 140

  SL_RAIL_UTIL_RSSI_OFFSET: 0

sdk_patches:
  - enable-greenpower-without-multipan.patch
